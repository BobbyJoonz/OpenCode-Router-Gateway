# ---------------------------------------------------------------------------
# OpenCode Router Gateway — docker compose stack
#
#   1. cp .env.example .env   and fill in GATEWAY_UPSTREAM_*
#   2. docker compose -f deploy/docker-compose.yml up -d --build
#
# The gateway is published on loopback only; Caddy (deploy/Caddyfile) terminates
# TLS and is the only public listener.
# ---------------------------------------------------------------------------
services:
  gateway:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        XRAY_BASE: ${XRAY_BASE:-https://github.com}
    image: opencode-router-gateway:latest
    container_name: orgw
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      PORT: "3000"
      DATA_DIR: /app/data
      NODE_OPTIONS: --max-old-space-size=512
    # Memory and process guards: expected footprint is ~200-350 MB.
    mem_limit: 1g
    pids_limit: 256
    ports:
      # Bind to loopback: publish through Caddy / a tunnel, never straight to the internet.
      - "127.0.0.1:3000:3000"
    volumes:
      - ../data:/app/data
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ---------------------------------------------------------------------------
  # HA-lite: continuous WAL replication (opt-in):  --profile ha
  # See docs/HA.md for the failover runbook.
  # ---------------------------------------------------------------------------
  litestream:
    image: litestream/litestream:0.3
    container_name: orgw-litestream
    profiles: ["ha"]
    restart: unless-stopped
    command: replicate -config /etc/litestream.yml
    volumes:
      - ../data:/app/data
      - ./litestream.yml:/etc/litestream.yml:ro
    environment:
      LITESTREAM_BUCKET: ${LITESTREAM_BUCKET:-}
      LITESTREAM_REGION: ${LITESTREAM_REGION:-us-east-1}
      LITESTREAM_ENDPOINT: ${LITESTREAM_ENDPOINT:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
